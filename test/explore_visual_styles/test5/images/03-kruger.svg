<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-label="Kruger study: presenter portrait with red text bars">
  <rect width="900" height="1200" fill="#b9b9b9"/>

  <!-- split exposure: dark half and light half -->
  <rect x="0" y="0" width="450" height="1200" fill="#1a1a1a"/>
  <path d="M450 1200 L450 860 Q240 700 120 780 L0 820 L0 1200 Z" fill="#101010"/>
  <path d="M450 1200 L450 860 Q660 700 780 780 L900 820 L900 1200 Z" fill="#d9d9d9"/>

  <!-- head, split by the exposure line -->
  <path d="M450 250 Q640 250 640 470 Q640 690 450 720 Q260 690 260 470 Q260 250 450 250 Z" fill="#8a8a8a"/>
  <path d="M450 250 Q260 250 260 470 Q260 690 450 720 Z" fill="#0d0d0d"/>
  <path d="M450 250 Q640 250 640 470 Q640 690 450 720 Z" fill="#e6e6e6"/>

  <!-- hair and features -->
  <path d="M250 470 Q250 230 450 230 Q650 230 650 470 L650 420 Q600 330 450 330 Q300 330 250 420 Z" fill="#3a3a3a"/>
  <path d="M250 470 Q250 230 450 230 Q650 230 650 470 L650 440 Q600 352 450 352 Q300 352 250 440 Z" fill="#efe9dc"/>
  <circle cx="372" cy="470" r="16" fill="#8d9b9c"/>
  <circle cx="528" cy="470" r="16" fill="#8d9b9c"/>
  <path d="M410 560 Q450 580 490 560" fill="none" stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"/>

  <!-- earpiece -->
  <path d="M640 470 q46 30 26 96" fill="none" stroke="#f2f2f2" stroke-width="12" stroke-linecap="round"/>
  <!-- microphone, held low right -->
  <line x1="700" y1="980" x2="760" y2="800" stroke="#1a1a1a" stroke-width="22" stroke-linecap="round"/>
  <circle cx="766" cy="778" r="26" fill="#1a1a1a"/>

  <!-- red bars with declarative type, crossing the subject -->
  <rect x="0" y="430" width="900" height="128" fill="#d0021b"/>
  <text x="40" y="522" font-family="Helvetica, Arial, sans-serif" font-size="86" font-weight="700" font-style="italic" fill="#ffffff">YOU ARE</text>
  <rect x="60" y="600" width="780" height="118" fill="#d0021b"/>
  <text x="88" y="684" font-family="Helvetica, Arial, sans-serif" font-size="62" font-weight="700" font-style="italic" fill="#ffffff">BEING WATCHED</text>
</svg>
