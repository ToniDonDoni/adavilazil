<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-label="Fukuda study: presenter profile with a screen-shaped counterform">
  <rect width="900" height="1200" fill="#f4efe4"/>

  <!-- shape 1: profile of the presenter, facing left -->
  <path d="M742 1200 L742 760 Q700 690 700 600 Q700 520 660 470 L640 430 Q632 404 600 404 L560 404 Q520 404 512 444 L500 492 Q452 500 430 536 Q414 562 436 578 L470 590 Q470 620 486 640 Q470 660 470 700 L470 760 Q500 700 560 700 L560 1200 Z" fill="#111111"/>

  <!-- shape 2: microphone -->
  <rect x="196" y="470" width="150" height="330" rx="75" fill="#111111"/>
  <rect x="196" y="470" width="150" height="330" rx="75" fill="none"/>

  <!-- shape 3: the counterform, cut as a screen between profile and microphone -->
  <rect x="372" y="470" width="96" height="330" fill="#f4efe4"/>

  <text x="196" y="404" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#111111">LIVE</text>
</svg>
