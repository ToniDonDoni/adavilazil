name: One-time V3 SVG concept raster preview

on:
  push:
    branches:
      - feat/abyssal-garden-kuindzhi-lalique
    paths:
      - .github/workflows/render-v3-svg-preview-once.yml

permissions:
  contents: write

jobs:
  render-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rasterize existing V3 SVG for visual inspection
        run: |
          python -m pip install --disable-pip-version-check cairosvg==2.7.1
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          p=Path('test/explore_visual_styles/kuindzhi_lalique_abyssal_garden/images')
          src=p/'SPEC-009-ABYSSAL-GARDEN-KUINDZHI-LALIQUE-V3-INITIAL.svg'
          dst=p/'SPEC-009-ABYSSAL-GARDEN-KUINDZHI-LALIQUE-V3-INITIAL.png'
          cairosvg.svg2png(url=str(src),write_to=str(dst),output_width=1536,output_height=1024)
          assert dst.exists() and dst.stat().st_size>10000
          print(dst,dst.stat().st_size)
          PY
      - name: Store preview and remove one-time renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'test/explore_visual_styles/kuindzhi_lalique_abyssal_garden/images/SPEC-009-ABYSSAL-GARDEN-KUINDZHI-LALIQUE-V3-INITIAL.png'
          git rm '.github/workflows/render-v3-svg-preview-once.yml'
          git commit -m "Archive initial V3 SVG raster for visual inspection"
          git push origin HEAD:feat/abyssal-garden-kuindzhi-lalique
