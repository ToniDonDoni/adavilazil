name: One-time final V2 artwork PNG render
on:
  push:
    branches: [feat/abyssal-garden-kuindzhi-lalique]
    paths: [.github/workflows/commit-v2-art-png-once.yml]
permissions:
  contents: write
jobs:
  commit-final-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-render refined original SVG
        run: |
          python -m pip install --disable-pip-version-check cairosvg==2.7.1
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          p=Path('test/explore_visual_styles/kuindzhi_lalique_abyssal_garden/images')
          svg=p/'SPEC-009-ABYSSAL-GARDEN-KUINDZHI-LALIQUE-V2.svg'
          png=p/'SPEC-009-ABYSSAL-GARDEN-KUINDZHI-LALIQUE-V2.png'
          cairosvg.svg2png(url=str(svg),write_to=str(png),output_width=1536,output_height=1024)
          assert png.stat().st_size > 10000
          print('Final PNG:',png,png.stat().st_size)
          PY
      - name: Commit final image and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'test/explore_visual_styles/kuindzhi_lalique_abyssal_garden/images/SPEC-009-ABYSSAL-GARDEN-KUINDZHI-LALIQUE-V2.png'
          git rm '.github/workflows/commit-v2-art-png-once.yml'
          git commit -m "Commit refined V2 underwater artwork PNG"
          git push origin HEAD:feat/abyssal-garden-kuindzhi-lalique
