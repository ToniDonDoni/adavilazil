name: Verify Abyssal Garden styles
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artwork:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cairosvg==2.7.1 Pillow==11.3.0
      - run: python test/explore_visual_styles/test9/verify_artwork.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abyssal-style-previews
          path: test/explore_visual_styles/test9/rendered/*.png
  shaders:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/naga
          key: ${{ runner.os }}-naga-cli-30.0.1-v1
      - name: Install Naga validator
        run: |
          if ! command -v naga >/dev/null 2>&1; then
            cargo install naga-cli --version 30.0.1 --locked
          fi
          naga --version
      - name: Validate inline JavaScript and WGSL
        run: node test/explore_visual_styles/test9/tools/validate.mjs
