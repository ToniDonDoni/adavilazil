name: One-time V3 final SVG raster preview
on:
  push:
    branches: [feat/abyssal-garden-kuindzhi-lalique]
    paths: [.github/workflows/render-v3-final-preview-once.yml]
permissions:
  contents: write
jobs:
  render-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rasterize revised V3 SVG for actual pixel review
        run: |
          python -m pip install --disable-pip-version-check cairosvg==2.7.1
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          p=Path('test/explore_visual_styles/kuindzhi_lalique_abyssal_garden/images')
          src=p/'SPEC-009-ABYSSAL-GARDEN-KUINDZHI-LALIQUE-V3.svg'
          dst=p/'SPEC-009-ABYSSAL-GARDEN-KUINDZHI-LALIQUE-V3.png'
          cairosvg.svg2png(url=str(src),write_to=str(dst),output_width=1536,output_height=1024)
          assert dst.exists() and dst.stat().st_size>10000
          print('Final PNG:',dst, dst.stat().st_size)
          PY
      - name: Commit raster preview and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'test/explore_visual_styles/kuindzhi_lalique_abyssal_garden/images/SPEC-009-ABYSSAL-GARDEN-KUINDZHI-LALIQUE-V3.png'
          git rm '.github/workflows/render-v3-final-preview-once.yml'
          git commit -m "Render refined V3 SVG concept PNG for visual verification"
          git push origin HEAD:feat/abyssal-garden-kuindzhi-lalique
